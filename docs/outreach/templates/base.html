{# Shared frame: page size, bleed, fonts and colours from the sender file. #}
<!doctype html>
<html lang="{{ c.lang }}">
<head>
<meta charset="utf-8">
<title>{{ c.title }}</title>
<style>
{% for role, font in s.fonts.items() %}
{% for face in font.files %}
@font-face {
  font-family: "{{ font.family | safe }}";
  src: url("{{ face.src | safe }}");
  font-weight: {{ face.weight | default('400') }};
  font-style: {{ face.style | default('normal') }};
}
{% endfor %}
{% endfor %}
@page {
  size: {{ W }}{{ unit }} {{ H }}{{ unit }};
  margin: 0;
  background: {{ k.paper }};
{% if bleed %}
  bleed: {{ bleed }}mm;
{% endif %}
{% if marks %}
  marks: crop;
{% endif %}
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color: {{ k.ink }}; font-family: "{{ s.fonts.body.family | safe }}", {{ s.fonts.body.fallback | safe }}; }
.serif { font-family: "{{ s.fonts.heading.family | safe }}", {{ s.fonts.heading.fallback | safe }}; }
.page { position: relative; width: {{ W }}{{ unit }}; height: {{ H }}{{ unit }}; page-break-after: always; }
.page:last-child { page-break-after: auto; }
.abs { position: absolute; }
.staff div { position: absolute; left: 0; right: 0; }
.qr svg { display: block; width: 100%; height: 100%; }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
