<!-- Banner for link previews, 1280 × 640 px (e.g. the "Social preview" of a repository). build.mjs fills the {{…}} values. -->
<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>{{project.name}} – {{t.kicker}}</title>
<style>
{{{base_css}}}
.page { background: var(--accent); }
.trim { display: block; color: var(--paper); }
.staff { position: absolute; left: 0; right: 0; top: 574px; height: 34px; }
.staff i { height: 2px; }
.side { position: absolute; left: 80px; top: 112px; width: 320px; text-align: center; }
.side .logo-box { width: 320px; height: 320px; }
.sender { margin-top: 18px; font-size: 22px; line-height: 1.3; }
.text { position: absolute; left: 460px; right: 64px; top: 84px; }
.kicker { font-size: 22px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--light); }
.kicker .app-icon { width: 1.5em; height: 1.5em; margin-right: 10px; vertical-align: -0.4em; }
h1 { margin-top: 10px; font-size: 104px; line-height: 1; }
.short { margin-top: 20px; font-size: 32px; line-height: 1.3; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.chips li { padding: 6px 14px; border: 2px solid var(--light); border-radius: 6px; font-size: 19px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--light); }
.url { margin-top: 18px; font-size: 24px; color: var(--light); }
</style>
</head>
<body>
<section class="page">
	<div class="trim">
		<div class="staff" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
		<div class="side">
			<div class="logo-box">{{{logo_on_dark_img}}}</div>
			<p class="sender">{{sender.name}}</p>
		</div>
		<div class="text">
			<p class="kicker">{{{app_icon}}}{{t.kicker}}</p>
			<h1>{{project.name}}</h1>
			<p class="short">{{t.short}}</p>
			<ul class="chips">{{#each t.pillars}}<li>{{chip}}</li>{{/each}}</ul>
			<p class="url">{{project.url_short}} · {{t.license_line}}</p>
		</div>
	</div>
</section>
</body>
</html>
