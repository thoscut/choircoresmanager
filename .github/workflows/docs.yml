# Checks of the documentation on every push and pull request, also when only
# documentation changed (the CI workflow skips those): equal headings in the
# German and English guides, links and anchors, screenshots that exist
# (src/__tests__/docs.test.ts).

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: Documentation (headings, links, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the documentation
        run: npx vitest run src/__tests__/docs.test.ts
