# Checks of the documentation on every push and pull request, also when only
# documentation changed (the CI workflow skips those): equal headings in the
# German and English guides, links and anchors, screenshots that exist
# (src/__tests__/docs.test.ts), and that the table of promises in SECURITY.md
# names only tests that exist (src/__tests__/security.test.ts).

name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  docs:
    name: Documentation (headings, links, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check the documentation
        run: npx vitest run src/__tests__/docs.test.ts src/__tests__/security.test.ts

  reuse:
    # Documentation alone skips the CI workflow, so the licence check of new
    # documents and screenshots runs here as well.
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check copyright and license information (reuse lint)
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
