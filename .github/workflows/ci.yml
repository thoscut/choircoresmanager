# Continuous integration of the Notenarchiv app on GitHub Actions.
#
# Every job runs in a pinned container image and installs what it needs, so
# it does not depend on the software of the runner host (the REUSE check runs
# in the image of its Docker action). Actions are pinned to the commit of a
# release (the version is noted next to the hash).
#
# Forgejo Actions (e.g. Codeberg) reads .github/workflows as well when a
# repository has no .forgejo/workflows; there the runner needs the label
# "ubuntu-latest". JavaScript actions such as actions/checkout run inside the
# job container on Forgejo and therefore need Node.js there; the PHP jobs
# install it first (GitHub brings its own).

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Documentation alone needs no build and no tests (same list below)
      - 'docs/**'
      - '**/*.md'
      - 'tools/screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'tools/screenshots/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run, so
# runner minutes are spent on the current state only.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSER_ALLOW_SUPERUSER: '1'
  COMPOSER_NO_INTERACTION: '1'
  DEBIAN_FRONTEND: noninteractive

jobs:
  appinfo:
    # The app store refuses a release whose appinfo/info.xml does not match
    # its schema, e.g. a wrong order of elements.
    name: App info against the app store schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: php:8.2-cli
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs ca-certificates curl libxml2-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate appinfo/info.xml
        run: |
          curl -fsSL -o "$RUNNER_TEMP/info.xsd" https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema "$RUNNER_TEMP/info.xsd" appinfo/info.xml

  reuse:
    # Every file states its copyright and license (https://reuse.software),
    # as in Nextcloud's own apps; see "Licensing (REUSE)" in tests/README.md.
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check copyright and license information (reuse lint)
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  php-lint:
    name: PHP lint ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint all PHP files
        run: find appinfo lib templates tests tools/ci -name '*.php' -print0 | xargs -0 -n1 php -l

  composer:
    name: Composer (validate, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: php:8.2-cli
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - name: Validate composer.json and lock file
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-progress
      - name: Audit dependencies of the app and the tools
        run: |
          composer audit
          composer bin all audit

  psalm:
    name: Psalm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: php:8.2-cli
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - name: Install dependencies
        run: composer install --no-progress
      - name: Static analysis
        run: vendor/bin/psalm --no-cache --no-progress --threads=2 --output-format=compact

  cs-check:
    name: Coding standard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The lowest supported PHP version, as recommended by PHP-CS-Fixer
      image: php:8.2-cli
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - name: Install dependencies
        run: composer install --no-progress
      - name: Check the coding standard
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none

  openapi:
    # openapi.json describes the API for agents (OCS, api/v1). It is generated
    # from lib/ResponseDefinitions.php and the controllers and must be
    # committed in the state the code describes.
    name: OpenAPI description up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: php:8.2-cli
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - name: Install dependencies
        run: composer install --no-progress
      - name: Generate openapi.json (nextcloud/openapi-extractor)
        run: composer run openapi
      - name: openapi.json is committed and current
        run: |
          if [ -n "$(git status --porcelain -- 'openapi*.json')" ]; then
            git status --porcelain -- 'openapi*.json'
            git --no-pager diff -- openapi.json | head -n 200
            echo "openapi.json is not up to date: run 'composer run openapi' and commit the result." >&2
            exit 1
          fi
          git diff --exit-code -- openapi.json

  phpunit:
    name: Unit tests ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Install job tools
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip curl nodejs ca-certificates libzip-dev
      - name: Install the zip extension (spreadsheet reader and writer tests)
        run: docker-php-ext-install zip >/dev/null && php -m | grep -qx zip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Composer
        run: sh .github/scripts/install-composer.sh
      - name: Install dependencies
        run: composer install --no-progress
      - name: Unit tests (without Nextcloud server)
        run: vendor/bin/phpunit -c tests/phpunit.xml --colors=never

  node:
    name: Frontend (lint, styles, types, unit tests, build, translations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Node.js and npm versions as required by "engines" in package.json
      image: node:24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # npm's download cache; npm ci still installs exactly the lock file
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Stylelint
        # Styles of the Vue components with Nextcloud's shared configuration
        run: npm run stylelint
      - name: Type check
        # vue-tsc: TypeScript and the templates of the Vue components
        run: npm run typecheck
      - name: Unit tests
        # vitest: score logic, catalog filters, text references, start parameters, durations,
        # maintenance helpers, MXL limits, SVG cleaning, focus voice emphasis,
        # start page labels in singular and plural, access to the inbox
        run: npm test
      - name: Build
        run: npm run build
      - name: Translations complete
        # Fails when a source string has no German translation.
        run: npm run l10n
      - name: Translation files up to date
        run: |
          if [ -n "$(git status --porcelain -- l10n)" ]; then
            git --no-pager diff --stat -- l10n
            echo "l10n/ is not up to date: run 'npm run l10n' and commit the result." >&2
            exit 1
          fi

  mcp:
    # The MCP server for agents (tools/mcp): own package and lock file, not
    # part of the app or its release archive.
    name: MCP server (build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24
    defaults:
      run:
        working-directory: tools/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test (node:test, HTTP mocked)
        run: npm test

  integration:
    # The integration tests in tests/Integration against a freshly installed
    # Nextcloud with MariaDB, the app and the public demo data (tools/demo).
    # The oldest and the newest supported Nextcloud (appinfo/info.xml).
    name: Integration tests, Nextcloud ${{ matrix.nextcloud }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        nextcloud: ['33', '35']
    container:
      image: php:8.3-cli
    services:
      mariadb:
        # Long-term support release, as on the acceptance instance
        image: mariadb:11.8
        env:
          # Throwaway database of this job only
          MARIADB_ROOT_PASSWORD: nextcloud-ci
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEXTCLOUD_ROOT: /opt/nextcloud
    defaults:
      run:
        # bash with -e and -o pipefail
        shell: bash
    steps:
      - name: Install job tools and the PHP extensions Nextcloud needs
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl bzip2 ca-certificates libpng-dev libzip-dev libicu-dev >/dev/null
          docker-php-ext-install -j"$(nproc)" gd intl pdo_mysql zip >/dev/null
          echo 'memory_limit = 1G' > /usr/local/etc/php/conf.d/zz-ci.ini
          php -r 'foreach (["gd", "intl", "pdo_mysql", "zip"] as $e) { extension_loaded($e) || exit(1); }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # As required by "engines" in package.json; the demo build needs 22 or newer
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/mcp/package-lock.json
      - name: Build the frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build the MCP server for the agent run (tools/mcp)
        run: |
          npm ci --prefix tools/mcp --no-audit --no-fund
          npm run build --prefix tools/mcp
      - name: Build the demo data
        run: node tools/demo/build.mjs
      - name: Look up the checksum of Nextcloud ${{ matrix.nextcloud }}
        # The small checksum file names the current release; its hash is the
        # cache key, so a new point release is downloaded once and then cached.
        id: nextcloud
        env:
          TARBALL: latest-${{ matrix.nextcloud }}.tar.bz2
        run: |
          mkdir -p ~/.cache/nextcloud
          cd ~/.cache/nextcloud
          curl -fsSL -o "$TARBALL.sha512" "https://download.nextcloud.com/server/releases/$TARBALL.sha512"
          # The file may list more than one archive: take the line of ours
          sha512="$(grep " $TARBALL\$" "$TARBALL.sha512" | cut -d' ' -f1)"
          [ -n "$sha512" ]
          echo "sha512=$sha512" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nextcloud/latest-${{ matrix.nextcloud }}.tar.bz2
          key: nextcloud-${{ matrix.nextcloud }}-${{ steps.nextcloud.outputs.sha512 }}
      - name: Download Nextcloud ${{ matrix.nextcloud }} (unless cached) and check its checksum
        env:
          TARBALL: latest-${{ matrix.nextcloud }}.tar.bz2
        run: |
          cd ~/.cache/nextcloud
          [ -f "$TARBALL" ] || curl -fsSLO "https://download.nextcloud.com/server/releases/$TARBALL"
          grep " $TARBALL\$" "$TARBALL.sha512" | sha512sum -c -
          tar -xjf "$TARBALL" -C "$(dirname "$NEXTCLOUD_ROOT")"
      - name: Install Nextcloud
        run: |
          admin_pass="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
          php "$NEXTCLOUD_ROOT/occ" maintenance:install --no-interaction \
            --database=mysql --database-host=mariadb --database-port=3306 \
            --database-name=nextcloud --database-user=root --database-pass=nextcloud-ci \
            --admin-user=admin --admin-pass="$admin_pass" \
            --data-dir="$NEXTCLOUD_ROOT/data"
          php "$NEXTCLOUD_ROOT/occ" status
      - name: Install the app
        # Only the runtime files, as in the release archive
        # (tools/release/package.sh). The app has no runtime dependencies
        # from Composer: "require" in composer.json holds only the plugin for
        # the tools in vendor-bin/, and Nextcloud loads the app's classes
        # itself, so no "composer install" is needed.
        run: |
          mkdir "$NEXTCLOUD_ROOT/apps/notenarchiv"
          cp -r appinfo lib templates img js css l10n LICENSE "$NEXTCLOUD_ROOT/apps/notenarchiv/"
          php "$NEXTCLOUD_ROOT/occ" app:enable notenarchiv
          for app in notenarchiv notifications; do
            php "$NEXTCLOUD_ROOT/occ" app:list --enabled | grep -E "^  - $app:"
          done
      - name: Integration tests and the agent run with the demo data
        # Step 7 of the script needs Nextcloud behind a web server: without
        # NC_URL it starts PHP's built-in server (php -S 127.0.0.1:8080) for
        # the Nextcloud directory and stops it at the end.
        run: bash tools/ci/integration-demo.sh "$NEXTCLOUD_ROOT"
