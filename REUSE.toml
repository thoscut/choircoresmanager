# SPDX-FileCopyrightText: 2026 Thomas Scheel and Cantoria contributors
# SPDX-License-Identifier: CC0-1.0
#
# Licensing of the files that carry no header of their own (REUSE 3.3,
# https://reuse.software). Every other file names its copyright and license in
# an SPDX comment at the top; see "Licensing (REUSE)" in tests/README.md.
version = 1
SPDX-PackageName = "cantoria"
SPDX-PackageSupplier = "Thomas Scheel"
SPDX-PackageDownloadLocation = "https://github.com/thoscut/choircoresmanager"

# The app: metadata (kept free of comments for the app store schema), icons,
# generated translations, documentation and screenshots of the user interface
[[annotations]]
path = [
	"appinfo/info.xml",
	"img/**",
	"l10n/**",
	"README.md",
	"CONTRIBUTING.md",
	"docs/**",
	"tools/screenshots/**",
	".github/ISSUE_TEMPLATE/**",
	".github/pull_request_template.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Thomas Scheel and Cantoria contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Package manifests, lock files and trivial configuration (as in nextcloud/deck)
[[annotations]]
path = [
	".nvmrc",
	"package.json",
	"package-lock.json",
	"composer.json",
	"composer.lock",
	"vendor-bin/**/composer.json",
	"vendor-bin/**/composer.lock",
	"tsconfig.json",
	"tools/mcp/package.json",
	"tools/mcp/package-lock.json",
	"tools/mcp/tsconfig.json",
	"tools/outreach/package.json",
	"tools/outreach/package-lock.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Thomas Scheel and Cantoria contributors"
SPDX-License-Identifier = "CC0-1.0"

# The OpenAPI description of the API for agents, generated from the code
# (composer run openapi), as in Nextcloud's own apps
[[annotations]]
path = ["openapi*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Thomas Scheel and Cantoria contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Texts and the invented example sender of the outreach material (JSON has
# no comments; see tools/outreach/README.md)
[[annotations]]
path = ["tools/outreach/content.json", "tools/outreach/example/sender.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Thomas Scheel and Cantoria contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Demo data, dedicated to the public domain (see tools/demo/README.md)
[[annotations]]
path = ["tools/demo/catalog.json", "tools/demo/scores/**", "tools/demo/reports/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Thomas Scheel and Cantoria contributors"
SPDX-License-Identifier = "CC0-1.0"

# Demo scores built from tools/demo (node tools/demo/build.mjs) as fixtures of
# the unit tests, dedicated to the public domain like the demo data
[[annotations]]
path = ["tests/fixtures/demo/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Thomas Scheel and Cantoria contributors"
SPDX-License-Identifier = "CC0-1.0"
